<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Seri No Sorgulama</title>
  <style>
    body { font-family: Arial; text-align:center; margin-top:50px; }
    input { padding:10px; width:250px; }
    button { padding:10px; }
    #sonuc { margin-top:20px; white-space:pre-line; }
  </style>
</head>
<body>

<h2>Seri No Sorgulama</h2>

<input type="text" id="search" placeholder="Seri no gir">
<button onclick="ara()">Ara</button>

<div id="sonuc"></div>

<script>
let data = [];

fetch("data.json")
  .then(res => res.json())
  .then(json => data = json);

function ara() {
  let input = document.getElementById("search").value.trim().toLowerCase();

  let sonuc = data.find(x => 
    x.seri_no && x.seri_no.toLowerCase() === input
  );

  if (sonuc) {
    document.getElementById("sonuc").innerText =
      "Seri No: " + sonuc.seri_no + "\n" +
      "Firma: " + sonuc.firma + "\n" +
      "Ürün: " + sonuc.urun + "\n" +
      "Tarih: " + sonuc.tarih;
  } else {
    document.getElementById("sonuc").innerText = "Bulunamadı";
  }
}
</script>

</body>
</html>
